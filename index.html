<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Roadmap 2027 — VNGGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=League+Gothic&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEFEF; --surface:#FFFFFF; --band:#F6F6F6; --ink:#161616; --muted:#5C5C5C; --line:#D9D9D9;
  --orange:#F05A22; --orange-deep:#D2501E; --on-orange:#FFFFFF;
  --off:#2EF0A0; --off-ink:#062B1C; --onl:#9CCBFF; --onl-ink:#0B2545; --mix:#FF9B1E; --mix-ink:#2A1300;
  --scrim:rgba(20,20,20,.35);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1C1C1C; --band:#222222; --ink:#F3F3F3; --muted:#A8A8A8; --line:#343434;
    --orange:#F05A22; --orange-deep:#FF7A44; --scrim:rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --band:#222222; --ink:#F3F3F3; --muted:#A8A8A8; --line:#343434;
  --orange:#F05A22; --orange-deep:#FF7A44; --scrim:rgba(0,0,0,.55); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'Inter Tight',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.01em}
h1,h2,h3{margin:0;font-weight:400}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.page{max-width:1600px;margin:0 auto;padding:24px 20px 48px}

/* Hero: thẻ dạng "folder tab" theo shape DNA của brand */
.hero{position:relative;background:var(--surface);padding:44px 32px 28px;margin-top:6px;
  clip-path:polygon(0 18px,58% 18px,calc(58% + 18px) 0,100% 0,100% 100%,0 100%);border-radius:0 0 18px 18px}
.brand{font:600 15px 'Inter Tight',sans-serif;color:var(--orange)}
.hero h1{font-family:'League Gothic','Inter Tight',sans-serif;font-size:clamp(56px,9vw,112px);line-height:.92;color:var(--orange);margin-top:6px;letter-spacing:.005em}
.hero p{max-width:62ch;margin:14px 0 0;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--band);cursor:pointer;text-align:left}
.chip .sw{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font:400 20px 'League Gothic',sans-serif}
.chip b{display:block;font-weight:600;font-size:14px}
.chip small{display:block;color:var(--muted);font-size:12px}
.chip.on{border-color:var(--ink)}
.chip:hover{border-color:var(--muted)}

/* Board */
.board-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:34px 2px 10px;flex-wrap:wrap}
.board-head h2{font-family:'League Gothic',sans-serif;font-size:40px;line-height:1}
.board-head p{margin:0;color:var(--muted);font-size:13px}
.scroller{overflow-x:auto;background:var(--surface);border-radius:18px;padding:14px 14px 18px 0;cursor:grab;scrollbar-width:thin}
.scroller.drag{cursor:grabbing;user-select:none}
.grid{--gcol:200px;--tcol:118px;--mcol:128px;display:grid;column-gap:6px;row-gap:5px;width:max-content;position:relative}
.grid.qview{width:100%;min-width:calc(var(--gcol) + var(--tcol) + 3*226px)}
.q{grid-row:1;height:38px;background:var(--orange);color:var(--on-orange);display:flex;align-items:flex-end;gap:8px;padding:0 12px 6px;
  clip-path:polygon(0 9px,100% 0,100% 100%,0 100%);border-radius:0 0 6px 6px}
.q b{font:400 24px/1 'League Gothic',sans-serif}
.q span{font-size:12px;opacity:.92}
.m{grid-row:2;text-align:center;color:var(--muted);font-size:12.5px;font-weight:500;padding:2px 0 4px}
.corner{grid-row:1/3;grid-column:1/3;position:sticky;left:0;z-index:3;background:var(--surface)}
.band{background:var(--band);border-radius:8px;min-height:34px}
.tlabel{grid-column:2;position:sticky;left:var(--gcol);z-index:2;background:var(--surface);display:flex;align-items:center;gap:7px;padding:0 8px 0 4px;font-size:12px;font-weight:600;color:var(--muted)}
.tlabel i{width:12px;height:12px;border-radius:4px;flex:none}
.tlabel .short{display:none}
.bar .cont{display:block;font-style:normal;font-size:11px;font-weight:600;opacity:.75;margin-top:3px}
.qf{display:flex;gap:6px;flex-wrap:wrap}
.qchip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font:400 20px/1 'League Gothic',sans-serif;letter-spacing:.02em;min-width:56px}
.qchip:hover{border-color:var(--muted)}
.qchip.on{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.glabel{grid-column:1;position:sticky;left:0;z-index:2;background:var(--surface);padding:0 10px 0 16px;display:flex;align-items:stretch}
.glabel button{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;border:0;background:var(--band);border-radius:10px;padding:8px 12px;cursor:pointer;border-left:4px solid var(--orange)}
.glabel .gs{font-size:11.5px;font-weight:600;color:var(--orange-deep)}
.glabel .gn{font:400 24px/1 'League Gothic',sans-serif}
.glabel .gp{font-size:11.5px;color:var(--muted);line-height:1.3}
.gsep{height:8px}

.bar{position:relative;z-index:1;border:0;text-align:left;cursor:pointer;padding:11px 10px 7px;min-height:54px;line-height:1.3;
  clip-path:polygon(0 7px,100% 0,100% 100%,0 100%);border-radius:0 0 8px 8px;transition:opacity .15s}
.bar b{display:block;font-weight:600;font-size:13.5px}
.bar span{display:block;font-size:12px;opacity:.85;margin-top:2px}
.bar.off{background:var(--off);color:var(--off-ink)}
.bar.onl{background:var(--onl);color:var(--onl-ink)}
.bar.mix{background:var(--mix);color:var(--mix-ink)}
.bar.unk{background:transparent;color:var(--ink);clip-path:none;border:1.5px dashed var(--muted);border-radius:8px}
.bar.unk.off{border-color:var(--off-ink)}
.bar.tbu-time{background:repeating-linear-gradient(135deg,var(--off) 0 10px,color-mix(in srgb,var(--off) 70%,var(--surface)) 10px 20px)}
.bar.dim{opacity:.14}
.bar.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.bar .flag{position:absolute;right:6px;bottom:5px;font-size:11px;font-weight:700;opacity:.75}
.none{grid-column:2/14;display:flex;align-items:center;padding:0 16px;min-height:62px;color:var(--muted);font-size:13px;border:1.5px dashed var(--line);border-radius:10px;position:relative;z-index:1}

/* Esports cluster */
.cluster{border-top:2px solid var(--orange);margin-top:6px;padding-top:6px}
.cluster button{position:sticky;left:16px;display:flex;align-items:baseline;gap:12px;border:0;background:none;cursor:pointer;padding:2px 0 0 16px;text-align:left}
.cluster .cn{font:400 30px/1 'League Gothic',sans-serif;color:var(--orange)}
.cluster .cs{font-size:12.5px;color:var(--muted)}
.glabel.sub{background:linear-gradient(var(--orange),var(--orange)) 24px 0/2px 100% no-repeat,var(--surface);padding-left:34px}
.glabel.sub button{border-left-color:var(--muted)}

/* Notes */
.notes{margin-top:28px;background:var(--surface);border-radius:18px;padding:22px 24px}
.notes h2{font-family:'League Gothic',sans-serif;font-size:32px;line-height:1;margin-bottom:10px}
.notes ul{margin:0;padding-left:20px;max-width:90ch}
.notes li{margin:6px 0}
.notes .src{color:var(--muted);font-size:13px;margin-top:14px}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:21;transform:translateX(102%);transition:transform .25s ease;
  display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 30px rgba(0,0,0,.18)}
.drawer.open{transform:none}
.drawer .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer .kind{display:inline-block;margin-top:2px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.drawer h3{font:400 38px/1 'League Gothic',sans-serif;margin-top:8px}
.drawer .game{color:var(--muted);font-size:13px;margin-top:4px}
.drawer .x{border:0;background:var(--band);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer;flex:none}
.drawer dl{margin:16px 0 0;overflow:auto;display:grid;grid-template-columns:132px 1fr;gap:10px 14px;align-content:start}
.drawer dt{color:var(--muted);font-size:13px}
.drawer dd{margin:0;font-size:14px}
.tbu{display:inline-block;padding:0 8px;border-radius:6px;background:var(--band);color:var(--muted);font-weight:600;font-size:12.5px}
.drawer .warn{margin-top:14px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--mix) 22%,var(--surface));font-size:13px}
@media (max-width:720px){
  .page{padding:16px 12px 40px}
  .hero{padding:38px 18px 20px}
  .grid{--gcol:124px;--tcol:58px;--mcol:118px}
  .tlabel .full{display:none}
  .tlabel .short{display:inline}
  .grid.qview{min-width:calc(var(--gcol) + var(--tcol) + 3*170px)}
  .glabel{padding-left:8px}
  .glabel .gn{font-size:20px}
  .drawer{top:auto;width:100%;height:min(82vh,640px);border-radius:18px 18px 0 0;transform:translateY(102%)}
  .drawer dl{grid-template-columns:110px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const put=(e)=>{grid.appendChild(e);return e;};

// ---------- Quý, dòng theo hình thức, render ----------
const QUARTERS=[{k:'all',label:'Cả năm',m:[1,12]},{k:'q1',label:'Q1',m:[1,3]},{k:'q2',label:'Q2',m:[4,6]},{k:'q3',label:'Q3',m:[7,9]},{k:'q4',label:'Q4',m:[10,12]}];
const QH=[['Q1','Tháng 1–3',1,3],['Q2','Tháng 4–6',4,6],['Q3','Tháng 7–9',7,9],['Q4','Tháng 10–12',10,12]];
const LINE_LABEL={onl:['Online','On'],off:['Offline','Off'],mix:['Online + Offline','On+Off'],unk:['Chưa rõ','?']};
let range=[1,12], qKey='all';
function pack(items){const lanes=[];items.slice().sort((a,b)=>a.s-b.s||b.e-a.e).forEach(it=>{let L=lanes.find(l=>l[l.length-1].e<it.s);if(!L){L=[];lanes.push(L);}L.push(it);});return lanes;}
function when(it){ return it.when || ('Tháng '+it.s+(it.e>it.s?'–'+it.e:'')); }
const inRange=it=>it.e>=range[0]&&it.s<=range[1];
const apply=t=>bars.forEach(b=>b.classList.toggle('dim',!!t&&b.dataset.t!==t));

function render(){
  grid.innerHTML=''; bars=[];
  const [m0,m1]=range, nm=m1-m0+1, full=nm===12, last=nm+3;
  grid.classList.toggle('qview',!full);
  grid.style.gridTemplateColumns=`var(--gcol) var(--tcol) repeat(${nm},${full?'var(--mcol)':'minmax(min(220px,30vw),1fr)'})`;
  const col=m=>m-m0+3;
  put(el('div','corner','',''));
  QH.forEach(([q,r,a,b])=>{ if(b<m0||a>m1) return; put(el('div','q',`<b>${q}</b><span>${r}</span>`,`grid-column:${col(Math.max(a,m0))}/${col(Math.min(b,m1))+1}`)); });
  for(let m=m0;m<=m1;m++) put(el('div','m','Tháng '+m,`grid-column:${col(m)}`));
  let row=3, curCluster=null, shown=0;
  GAMES.forEach((g,gi)=>{
    const its=g.items.filter(inRange);
    if(!full && !its.length) return;
    shown++;
    if(g.cluster && g.cluster!==curCluster){
      const C=CLUSTERS[g.cluster], h=put(el('div','cluster','',`grid-row:${row};grid-column:1/${last}`));
      const hb=el('button','',`<span class="cn">${C.name}</span><span class="cs">${C.sub}</span>`); hb.type='button'; hb.onclick=()=>openCluster(g.cluster); h.appendChild(hb); row++;
    }
    curCluster=g.cluster||null;
    const types=['onl','off','mix'].concat(its.some(i=>i.t==='unk')?['unk']:[]);
    const lines=types.map(t=>({t,lanes:pack(its.filter(i=>i.t===t))}));
    const total=lines.reduce((a,l)=>a+Math.max(1,l.lanes.length),0);
    const lab=put(el('div','glabel'+(g.cluster?' sub':''),'',`grid-row:${row}/${row+total}`));
    const lb=el('button','',`<span class="gs">${g.gs}</span><span class="gn">${g.name}</span><span class="gp">${g.genre}</span>`);
    lb.type='button'; lb.setAttribute('aria-label',`${g.name}, ${g.genre}. Xem thông tin game`); lb.onclick=()=>openGame(g); lab.appendChild(lb);
    let r=row;
    lines.forEach(({t,lanes})=>{
      const n=Math.max(1,lanes.length), ty=TYPES[t];
      put(el('div','tlabel '+t,`<i style="background:${ty.bg};${t==='unk'?'border:1.5px dashed var(--muted)':''}"></i><span class="full">${LINE_LABEL[t][0]}</span><span class="short">${LINE_LABEL[t][1]}</span>`,`grid-row:${r}/${r+n}`));
      put(el('div','band','',`grid-row:${r}/${r+n};grid-column:3/${last}`));
      lanes.forEach((lane,li)=>lane.forEach(it=>{
        const s=Math.max(it.s,m0), e=Math.min(it.e,m1);
        const cont=(it.s<m0?`<em class="cont">Từ tháng ${it.s}</em>`:'')+(it.e>m1?`<em class="cont">Đến tháng ${it.e}</em>`:'');
        const b=el('button',`bar ${t}${it.tbuTime?' tbu-time':''}`,`<b>${it.n}</b><span>${it.d}</span>${cont}`,`grid-row:${r+li};grid-column:${col(s)}/${col(e)+1}`);
        b.type='button'; b.dataset.t=t; b.setAttribute('aria-label',`${it.n}, ${g.name}, ${ty.label}, ${when(it)}`);
        b.onclick=()=>{ if(moved) return; openItem(g,it,b); };
        put(b); bars.push(b);
      }));
      r+=n;
    });
    row=r; put(el('div','gsep','',`grid-row:${row};grid-column:1/${last}`)); row++;
  });
  if(!shown) put(el('div','none','Quý này chưa có hoạt động nào.',`grid-row:3;grid-column:3/${last}`));
  // legend counts theo phạm vi đang xem
  const counts={}; GAMES.forEach(g=>g.items.filter(inRange).forEach(it=>counts[it.t]=(counts[it.t]||0)+1));
  legend.innerHTML='';
  if(lock && !counts[lock]) lock=null;
  Object.entries(TYPES).forEach(([k,v])=>{
    if(!counts[k]) return;
    const c=el('button','chip'+(lock===k?' on':''),`<span class="sw" style="background:${v.bg};color:${v.ink};${k==='unk'?'border:1.5px dashed var(--muted)':''}">${counts[k]}</span><span><b>${v.label}</b><small>${v.hint}</small></span>`);
    c.type='button'; c.setAttribute('aria-pressed',String(lock===k));
    c.onmouseenter=()=>apply(k); c.onmouseleave=()=>apply(lock); c.onfocus=()=>apply(k); c.onblur=()=>apply(lock);
    c.onclick=()=>{ lock=lock===k?null:k; [...legend.children].forEach(x=>{const on=x===c&&lock===k;x.classList.toggle('on',on);x.setAttribute('aria-pressed',String(on));}); apply(lock); };
    legend.appendChild(c);
  });
  apply(lock);
  document.getElementById('boardTitle').textContent=full?'Lịch 12 tháng':`Quý ${qKey.slice(1)}, tháng ${m0}–${m1}`;
  document.getElementById('boardHint').textContent=full
    ?'Mỗi game chia 3 dòng theo hình thức. Bấm vào khối để xem chi tiết, kéo ngang để xem các tháng sau.'
    :`Đang xem ${shown} game có hoạt động trong quý. Khối kéo dài sang quý khác có ghi chú tháng bắt đầu hoặc kết thúc.`;
}
const qf=document.getElementById('qf');
QUARTERS.forEach(q=>{
  const b=el('button','qchip'+(q.k==='all'?' on':''),q.label); b.type='button'; b.setAttribute('aria-pressed',String(q.k==='all'));
  b.onclick=()=>{ qKey=q.k; range=q.m; [...qf.children].forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',String(on));}); document.getElementById('scroller').scrollLeft=0; render(); };
  qf.appendChild(b);
});
render();

// notes


// drawer
const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
const val=v=>v?v:`<span class="tbu">${T}</span>`;
function show(kindHTML,title,gameLine,rows,warn){
  document.getElementById('dKind').outerHTML=kindHTML;
  document.getElementById('dTitle').textContent=title;
  document.getElementById('dGame').textContent=gameLine;
  document.getElementById('dList').innerHTML=rows.map(([k,v])=>`<dt>${k}</dt><dd>${val(v)}</dd>`).join('');
  const w=document.getElementById('dWarn'); w.hidden=!warn; w.textContent=warn||'';
  lastFocus=document.activeElement;
  drawer.classList.add('open'); scrim.classList.add('open'); drawer.setAttribute('aria-hidden','false');
  document.getElementById('dClose').focus();
}
function openItem(g,it,b){
  bars.forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
  const ty=TYPES[it.t];
  show(`<span class="kind" id="dKind" style="background:${ty.bg};color:${ty.ink};${it.t==='unk'?'border:1.5px dashed var(--muted)':''}">${ty.label}</span>`,it.n,`${g.name} (${g.gs})`,[
    ['Thời gian',when(it)],['Hình thức',it.form||(it.t==='unk'?'':ty.label)],['Mục tiêu',it.goal],['Khu vực',it.area],['Số lượng tham gia',it.qty],
    ['KPI/traffic',it.kpi],['Brand mong muốn',it.brand],['Hoạt động online',it.on],['Hoạt động offline',it.off],['Hợp tác in-game',it.ig]],'');
}
function openGame(g){
  bars.forEach(x=>x.classList.remove('sel'));
  const c={};g.items.forEach(it=>c[it.t]=(c[it.t]||0)+1);
  show(`<span class="kind" id="dKind" style="background:var(--orange);color:var(--on-orange)">${g.gs}</span>`,g.name,g.genre,[
    ['Thể loại',g.genre],...(g.products?[['Sản phẩm',g.products]]:[]),['Số hoạt động',g.items.length?String(g.items.length):''],
    ...Object.entries(c).map(([k,v])=>[TYPES[k].label,String(v)]),
    ['Thông tin game',g.info]],g.items.length?'':'Chưa có roadmap cho game này.');
}
function openCluster(key){
  const C=CLUSTERS[key], gs=GAMES.filter(g=>g.cluster===key);
  bars.forEach(x=>x.classList.remove('sel'));
  show(`<span class="kind" id="dKind" style="background:var(--orange);color:var(--on-orange)">Cụm</span>`,C.name,C.sub,[
    ...gs.map(g=>[g.name,g.items.length+' giải']),['Gói tài trợ',ESP_BRAND],['Ghi chú',C.info]],'');
}
function closeD(){ drawer.classList.remove('open'); scrim.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); bars.forEach(x=>x.classList.remove('sel')); if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
document.getElementById('dClose').onclick=closeD; scrim.onclick=closeD;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&drawer.classList.contains('open')) closeD(); });

// drag to scroll
const sc=document.getElementById('scroller'); let down=false,sx=0,sl=0,moved=false;
sc.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse') return; down=true; moved=false; sx=e.clientX; sl=sc.scrollLeft; });
window.addEventListener('pointermove',e=>{ if(!down) return; const dx=e.clientX-sx; if(Math.abs(dx)>5){ moved=true; sc.classList.add('drag'); } if(moved) sc.scrollLeft=sl-dx; });
window.addEventListener('pointerup',()=>{ down=false; sc.classList.remove('drag'); setTimeout(()=>moved=false,0); });
</script>
